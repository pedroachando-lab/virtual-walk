<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Walk - Zen Mode</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }

        /* Vídeo em Fundo Total */
        #video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: flex; align-items: center; justify-content: center; background: #111; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Camada de UI (Desaparece no Modo Foco) */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; transition: opacity 0.4s ease; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
        .ui-layer.hidden { opacity: 0; pointer-events: none; }
        .interactive { pointer-events: auto; }

        /* HUD Discreto (Topo) */
        .hud-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .hud-badge { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.1); }

        /* Controlos (Rodapé) */
        .hud-bottom { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .control-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); padding: 12px 16px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.15); }
        
        button { background: rgba(255, 255, 255, 0.15); border: none; color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        button:active { background: rgba(255, 255, 255, 0.3); }
        button.primary { background: #10b981; color: #000; }

        /* Widget Spotify Minimalista */
        .spotify-widget { display: flex; align-items: center; justify-content: space-between; background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(10px); padding: 10px 14px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .track-info { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

        /* Ecrã de Bloqueio Ativo */
        #screen-lock-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; background: rgba(0,0,0,0.8); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
        #screen-lock-overlay.active { display: flex; }
    </style>
</head>
<body>

    <!-- Vídeo de Simulação -->
    <div id="video-container">
        <video id="route-video" src="" loop playsinline muted></video>
    </div>

    <!-- Interface Principal (Modo Foco) -->
    <div class="ui-layer" id="uiLayer">
        <!-- Topo: Métricas e Estado -->
        <div class="hud-top">
            <div class="hud-badge" id="hudTime">⏱️ 00:00</div>
            <div class="hud-badge" id="hudSpeed">⚡ 0.0 km/h</div>
            <div class="hud-badge" id="hudDist">📍 0.00 km</div>
        </div>

        <!-- Rodapé: Controlos e Atalhos -->
        <div class="hud-bottom">
            <!-- Widget de Música Compacto -->
            <div class="spotify-widget interactive">
                <div class="track-info">🎵 <b>Papaoutai</b> • Stromae</div>
                <div>
                    <button onclick="prevTrack()">⏮</button>
                    <button onclick="togglePlayMusic()">⏯</button>
                    <button onclick="nextTrack()">⏭</button>
                </div>
            </div>

            <!-- Barra de Ações Rápidas -->
            <div class="control-bar interactive">
                <button onclick="togglePlayVideo()" id="playBtn" class="primary">Pausar</button>
                <button onclick="openKsFitModal()">📸 Importar KS Fit</button>
                <button onclick="enableScreenLock()">🔒 Bloquear</button>
            </div>
        </div>
    </div>

    <!-- Overlay de Ecrã Bloqueado (Proteção contra toques de suor) -->
    <div id="screen-lock-overlay" onclick="handleLockClick()">
        <div style="font-size: 40px;">🔒</div>
        <div style="font-size: 14px; color: #aaa;">Ecrã Bloqueado</div>
        <button style="background: #fff; color: #000; margin-top: 10px;">Manter premido para desbloquear</button>
    </div>

    <script>
        let uiLayer = document.getElementById('uiLayer');
        let video = document.getElementById('route-video');
        let hideTimeout;
        let isLocked = false;

        // Gestão do Modo Foco (Ocultar UI após 3 segundos de inatividade)
        function resetInactivityTimer() {
            if (isLocked) return;
            uiLayer.classList.remove('hidden');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                if (!video.paused) {
                    uiLayer.classList.add('hidden');
                }
            }, 3000);
        }

        // Detetar toques no ecrã para mostrar/ocultar UI
        document.addEventListener('pointerdown', (e) => {
            // Se clicar em elementos interativos, não faz o toggle global
            if (e.target.closest('.interactive')) {
                resetInactivityTimer();
                return;
            }
            if (uiLayer.classList.contains('hidden')) {
                uiLayer.classList.remove('hidden');
                resetInactivityTimer();
            } else {
                uiLayer.classList.add('hidden');
            }
        });

        // Duplo toque para Play/Pause rápido
        let lastTap = 0;
        document.addEventListener('touchend', (e) => {
            let currentTime = new Date().getTime();
            let tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                togglePlayVideo();
                e.preventDefault();
            }
            lastTap = currentTime;
        });

        function togglePlayVideo() {
            if (video.paused) {
                video.play();
                document.getElementById('playBtn').innerText = "Pausar";
                resetInactivityTimer();
            } else {
                video.pause();
                document.getElementById('playBtn').innerText = "Retomar";
                uiLayer.classList.remove('hidden');
                clearTimeout(hideTimeout);
            }
        }

        // Sistema de Bloqueio de Ecrã Antissuor
        let unlockCounter = 0;
        function enableScreenLock() {
            isLocked = true;
            document.getElementById('screen-lock-overlay').classList.add('active');
            uiLayer.classList.add('hidden');
        }

        function handleLockClick() {
            // Exemplo simples: 3 toques rápidos para desbloquear
            unlockCounter++;
            setTimeout(() => { unlockCounter = 0; }, 1000);
            if (unlockCounter >= 3) {
                isLocked = false;
                document.getElementById('screen-lock-overlay').classList.remove('active');
                unlockCounter = 0;
                resetInactivityTimer();
            }
        }

        // Funções placeholder para o Spotify e KS Fit
        function togglePlayMusic() { console.log("Toggle música Spotify"); }
        function prevTrack() { console.log("Música anterior"); }
        function nextTrack() { console.log("Próxima música"); }
        function openKsFitModal() { alert("Abrir seletor de printscreen da KS Fit para leitura automática."); }

        // Inicializar temporizador
        resetInactivityTimer();
    </script>
</body>
</html>
